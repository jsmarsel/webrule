proxy-groups:
  - name: PROXY
    type: select
    use:
      - provider-1
    proxies:
      - AUTO
      - FALLBACK
      - DIRECT

  - name: AUTO
    type: url-test
    use:
      - provider-1
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204

  - name: FALLBACK
    type: fallback
    use:
      - provider-1
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204

  - name: AI
    type: select
    use:
      - provider-1
    proxies:
      - PROXY
      - AUTO
      - FALLBACK
      - DIRECT

  - name: YouTube
    type: select
    use:
      - provider-1
    proxies:
      - PROXY
      - AUTO
      - FALLBACK
      - DIRECT

  - name: Netflix
    type: select
