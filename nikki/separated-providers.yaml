proxy-providers:
  provider-1:
    type: http
    url: REPLACE_WITH_YOUR_PROVIDER_SUBSCRIPTION_URL
    path: ./providers/proxy/provider-1.yaml
    interval: 21600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204
    override:
      additional-prefix: "[P1] "

